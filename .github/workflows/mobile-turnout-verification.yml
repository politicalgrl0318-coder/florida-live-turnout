name: Mobile turnout and live source verification
on:
  push:
    branches: [main, fix/mobile-live-turnout-20261024]
permissions:
  contents: read
concurrency:
  group: mobile-turnout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: 305-DATA-GIRL-DASHBOARD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned app dependencies
        run: npm ci --no-audit --no-fund
      - name: Existing reconciliation regressions
        run: node --experimental-strip-types --test tests/turnout-selection.test.mjs
      - name: County-method and official source regressions
        run: node --experimental-strip-types --loader ./scripts/resolve-ts.mjs --test tests/turnout-methods.test.mjs
      - name: Production build
        run: npm run build
      - name: Install browser test runner without changing app dependencies
        run: |
          mkdir -p .browser-runner
          npm install --prefix .browser-runner --no-save --package-lock=false playwright@1.56.1 --no-audit --no-fund
          ln -s ../.browser-runner/node_modules/playwright node_modules/playwright
          .browser-runner/node_modules/.bin/playwright install --with-deps chromium
      - name: Start branch preview using the deployed app runtime
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p verification/mobile-turnout
          npm run start -- --port 3000 > verification/mobile-turnout/preview.log 2>&1 &
      - name: Verify branch rendering against official sources
        if: github.ref != 'refs/heads/main'
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node scripts/verify-mobile-turnout.mjs
      - name: Verify deployed rendering against official sources
        if: github.ref == 'refs/heads/main'
        run: node scripts/verify-mobile-turnout.mjs
      - name: Preserve screenshots and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-turnout-verification
          path: 305-DATA-GIRL-DASHBOARD/verification/mobile-turnout
          retention-days: 14
      - name: Preserve changed source for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-turnout-source
          path: |
            305-DATA-GIRL-DASHBOARD/app/general/method-selection.ts
            305-DATA-GIRL-DASHBOARD/app/general/county-reports.ts
            305-DATA-GIRL-DASHBOARD/app/general/county-seed.ts
            305-DATA-GIRL-DASHBOARD/app/general/official-methods.ts
            305-DATA-GIRL-DASHBOARD/public/data/general-county-seed.json
            305-DATA-GIRL-DASHBOARD/public/data/general-verified-update.json
            305-DATA-GIRL-DASHBOARD/scripts/resolve-ts.mjs
            305-DATA-GIRL-DASHBOARD/tests/turnout-methods.test.mjs
          retention-days: 7
