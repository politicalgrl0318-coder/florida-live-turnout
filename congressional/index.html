const UNIT_LABELS={};
const PARTY_NAMES={dem:'Democratic',rep:'Republican',npa:'NPA/Other'};
let activeParty='dem', activeMetric='rate', selectedKey=null;
const fmt=n=>Number(n).toLocaleString(); const pct=n=>Number(n).toFixed(2)+'%';
function metricValue(d){ if(activeMetric==='rate')return d.rate;if(activeMetric==='early')return d.early;if(activeMetric==='combined')return d.combined;return d.returned; }
function rankMap(){const a=Object.keys(DATA).filter(k=>activeMetric!=='early'||REPORTING.has(k)).sort((a,b)=>metricValue(DATA[b][activeParty])-metricValue(DATA[a][activeParty]));return Object.fromEntries(a.map((k,i)=>[k,i+1]));}
function detail(k){const all=DATA[k],p=all[activeParty],status=REPORTING.has(k)?fmt(p.early):'Not yet reporting',unit=UNIT_LABELS[k]?UNIT_LABELS[k]+' County':'FL-'+k;const ranks=rankMap();return `<strong>${unit} · ${PARTY_NAMES[activeParty]}</strong><span>VBM: ${fmt(p.returned)} returned / ${fmt(p.mailed)} mailed · ${fmt(p.outstanding)} outstanding · ${pct(p.rate)} conversion</span><span>Early vote: ${status}</span><span>Combined votes cast: ${fmt(p.combined)} · ${pct(p.share)} party share</span><span>${activeMetric==='early'&&!REPORTING.has(k)?'EV rank unavailable':'Rank #'+ranks[k]}</span>`;}
</script><script>(()=>{const root=document.getElementById('fl-party-return-map'),paths=root.querySelectorAll('.district'),buttons=root.querySelectorAll('[data-party]'),measure=document.getElementById('map-measure'),box=root.querySelector('.fl-map-summary');selectedKey='28';function paint(){const ranks=rankMap(),max=Math.max(...Object.values(ranks));paths.forEach(p=>{const k=p.dataset.district;let fill='#2474d2',opacity=.16;if(activeMetric==='early'&&!REPORTING.has(k)){fill='#d9dee5';opacity=.9}else{opacity=.18+(max-(ranks[k]||max))*.78/Math.max(1,max-1)}p.style.fill=fill;p.style.fillOpacity=opacity;p.classList.toggle('is-selected',k===selectedKey);p.setAttribute('aria-label',detail(k).replace(/<[^>]+>/g,' '));});box.innerHTML=detail(selectedKey)}buttons.forEach(b=>b.onclick=()=>{activeParty=b.dataset.party;buttons.forEach(x=>{x.classList.toggle('btn-primary',x===b);x.setAttribute('aria-pressed',x===b)});paint()});measure.onchange=e=>{activeMetric=e.target.value;paint()};paths.forEach(p=>{p.onpointerenter=()=>{selectedKey=p.dataset.district;paint()};p.onclick=()=>{selectedKey=p.dataset.district;paint()}});paint()})();</script>
